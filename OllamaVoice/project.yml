name: OllamaVoice
options:
  bundleIdPrefix: com.vohefett
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  OllamaVoice:
    type: application
    platform: iOS
    sources:
      - path: OllamaVoice
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vohefett.OllamaVoice
        PRODUCT_NAME: OllamaVoice
        INFOPLIST_FILE: OllamaVoice/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 10
        MARKETING_VERSION: "1.1.1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ENABLE_TESTABILITY: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ollama Voice
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    scheme:
      testTargets:
        - OllamaVoiceTests
  OllamaVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OllamaVoiceTests
    dependencies:
      - target: OllamaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vohefett.OllamaVoiceTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OllamaVoice.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OllamaVoice"
        BUNDLE_LOADER: "$(TEST_HOST)"
